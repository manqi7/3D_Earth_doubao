<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 全球主要城市人口可视化 (Three.js)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        
        /* Tooltip 样式 */
        /* Tooltip 玻璃拟态风格 */
        #tooltip {
            position: absolute;
            background: rgba(15, 25, 45, 0.75);
            border: 1px solid rgba(0, 255, 255, 0.3);
            color: #fff;
            padding: 16px 20px;
            border-radius: 12px;
            pointer-events: none;
            display: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3),
                        0 0 20px rgba(0, 255, 255, 0.15);
            font-size: 14px;
            z-index: 1000;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            min-width: 220px;
            transform: translate(-50%, -100%);
        }
        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
        }
        .flag-container {
            width: 48px;
            height: 36px;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            background: rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .flag-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .flag-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667 0%, #889 100%);
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .title-group h3 {
            margin: 0;
            font-size: 18px;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        .title-group .country-name {
            margin: 2px 0 0 0;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }
        .tooltip-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .info-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }
        .info-value {
            color: #fff;
            font-weight: 500;
            font-size: 14px;
        }
        .coord-value {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            background: rgba(0, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }
        
        /* 加载提示 */
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 20px; pointer-events: none; transition: opacity 0.5s;
        }
    </style>
    <!-- 引入 Three.js 和 OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="loading">正在初始化 3D 场景...</div>
    <div id="tooltip"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ================= 配置与数据 =================
        const CONFIG = {
            earthRadius: 100,
            barHeightScale: 0.015, // 人口高度缩放系数
            minBarHeight: 0.5,
            colors: {
                ocean: 0x0a1a2f,
                land: 0x1a3a5c, // 程序化模拟陆地色
                lowPop: 0x00ffff,   // 青色 < 2000
                midPop: 0xffaa00,   // 橙色 2000-3000
                highPop: 0xff0000,  // 红色 > 3000
                atmosphere: 0x0088ff
            }
        };

        // ================= 国家 ISO 代码映射表 =================
        const countryIsoMap = {
            "中国": "CN", "美国": "US", "日本": "JP", "印度": "IN", "印度尼西亚": "ID",
            "巴西": "BR", "俄罗斯": "RU", "墨西哥": "MX", "埃及": "EG", "土耳其": "TR",
            "菲律宾": "PH", "尼日利亚": "NG", "孟加拉国": "BD", "巴基斯坦": "PK",
            "阿根廷": "AR", "刚果金": "CD", "韩国": "KR", "法国": "FR", "英国": "GB",
            "德国": "DE", "意大利": "IT", "西班牙": "ES", "加拿大": "CA", "澳大利亚": "AU"
        };

        // ================= 国旗 CDN URL 构造器 =================
        function getFlagUrl(isoCode) {
            if (!isoCode) return null;
            // 使用 CDN 国旗资源（flagcdn.com）
            return `https://flagcdn.com/w80/${isoCode.toLowerCase()}.png`;
        }

        // ================= 国旗加载容错处理（暴露到全局） =================
        window.handleFlagError = function(imgElement, isoCode) {
            imgElement.onerror = null;
            // 备用 CDN
            imgElement.src = `https://flagsapi.com/${isoCode.toUpperCase()}/flat/64.png`;
            // 二次失败则显示占位符
            imgElement.onerror = () => {
                const container = imgElement.parentElement;
                container.innerHTML = `<div class="flag-placeholder">${isoCode || '?'}</div>`;
            };
        };

        // 真实数据：2025-2026 预估全球主要城市人口 (单位：万人)
        const cityData = [
            { city: "雅加达", country: "印度尼西亚", lat: -6.2088, lon: 106.8456, population: 4190 },
            { city: "达卡", country: "孟加拉国", lat: 23.8103, lon: 90.4125, population: 3660 },
            { city: "东京", country: "日本", lat: 35.6762, lon: 139.6503, population: 3340 },
            { city: "新德里", country: "印度", lat: 28.6139, lon: 77.2090, population: 3020 },
            { city: "上海", country: "中国", lat: 31.2304, lon: 121.4737, population: 2960 },
            { city: "广州", country: "中国", lat: 23.1291, lon: 113.2644, population: 2760 },
            { city: "开罗", country: "埃及", lat: 30.0444, lon: 31.2357, population: 2560 },
            { city: "马尼拉", country: "菲律宾", lat: 14.5995, lon: 120.9842, population: 2470 },
            { city: "孟买", country: "印度", lat: 19.0760, lon: 72.8777, population: 2300 },
            { city: "圣保罗", country: "巴西", lat: -23.5505, lon: -46.6333, population: 2299 },
            { city: "墨西哥城", country: "墨西哥", lat: 19.4326, lon: -99.1332, population: 2275 },
            { city: "北京", country: "中国", lat: 39.9042, lon: 116.4074, population: 2260 },
            { city: "大阪", country: "日本", lat: 34.6937, lon: 135.5023, population: 1892 },
            { city: "重庆", country: "中国", lat: 29.4316, lon: 106.9123, population: 1817 },
            { city: "卡拉奇", country: "巴基斯坦", lat: 24.8607, lon: 67.0011, population: 1780 },
            { city: "伊斯坦布尔", country: "土耳其", lat: 41.0082, lon: 28.9784, population: 1600 },
            { city: "金沙萨", country: "刚果金", lat: -4.4419, lon: 15.2663, population: 1560 },
            { city: "拉各斯", country: "尼日利亚", lat: 6.5244, lon: 3.3792, population: 1540 },
            { city: "布宜诺斯艾利斯", country: "阿根廷", lat: -34.6037, lon: -58.3816, population: 1530 },
            { city: "加尔各答", country: "印度", lat: 22.5726, lon: 88.3639, population: 1510 }
        ].map(city => ({
            ...city,
            isoCode: countryIsoMap[city.country] || null
        }));

        // ================= 初始化场景 =================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 280); // 初始相机位置

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // 控制器
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 120;
        controls.maxDistance = 500;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // 灯光
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // 环境光
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(100, 50, 100);
        scene.add(dirLight);
        const pointLight = new THREE.PointLight(0x0088ff, 1.5, 300);
        pointLight.position.set(0, 0, 0); // 地心发光
        scene.add(pointLight);

        // ================= 创建地球 (程序化材质) =================
        // 使用 ShaderMaterial 模拟简单的海洋和陆地噪点，避免加载外部图片跨域问题
        const earthGeometry = new THREE.SphereGeometry(CONFIG.earthRadius, 64, 64);
        
        const earthVertexShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            varying vec3 vPosition;
            void main() {
                vUv = uv;
                vNormal = normalize(normalMatrix * normal);
                vPosition = position;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
        `;

        const earthFragmentShader = `
            varying vec2 vUv;
            varying vec3 vNormal;
            
            // 简单的噪点函数模拟大陆轮廓
            float random(vec2 st) {
                return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
            }
            float noise(vec2 st) {
                vec2 i = floor(st);
                vec2 f = fract(st);
                float a = random(i);
                float b = random(i + vec2(1.0, 0.0));
                float c = random(i + vec2(0.0, 1.0));
                float d = random(i + vec2(1.0, 1.0));
                vec2 u = f*f*(3.0-2.0*f);
                return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
            }
            
            void main() {
                // 生成多层噪点模拟地形
                float n = noise(vUv * 4.0);
                n += 0.5 * noise(vUv * 8.0);
                n += 0.25 * noise(vUv * 16.0);
                n = smoothstep(0.4, 0.6, n); // 二值化阈值
                
                vec3 oceanColor = vec3(0.04, 0.1, 0.18); // 深蓝
                vec3 landColor = vec3(0.1, 0.25, 0.15);  // 暗绿
                
                vec3 finalColor = mix(oceanColor, landColor, n);
                
                // 添加边缘光照效果
                float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1)), 2.0);
                finalColor += vec3(0.0, 0.3, 0.5) * intensity;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        const earthMaterial = new THREE.ShaderMaterial({
            vertexShader: earthVertexShader,
            fragmentShader: earthFragmentShader
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // ================= 大气层光晕 =================
        const atmoGeometry = new THREE.SphereGeometry(CONFIG.earthRadius * 1.02, 64, 64);
        const atmoMaterial = new THREE.ShaderMaterial({
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.7 - dot(vNormal, vec3(0, 0, 1)), 3.0);
                    gl_FragColor = vec4(0.0, 0.5, 1.0, 1.0) * intensity;
                }
            `,
            blending: THREE.AdditiveBlending,
            side: THREE.BackSide,
            transparent: true
        });
        const atmosphere = new THREE.Mesh(atmoGeometry, atmoMaterial);
        scene.add(atmosphere);

        // ================= 核心逻辑：经纬度转 3D 坐标 =================
        /**
         * 将经纬度转换为 Three.js 中的向量坐标
         * @param {number} lat 纬度 (-90 ~ 90)
         * @param {number} lon 经度 (-180 ~ 180)
         * @param {number} radius 球体半径
         * @returns {THREE.Vector3}
         */
        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180); // 极角
            const theta = (lon + 180) * (Math.PI / 180); // 方位角

            const x = -(radius * Math.sin(phi) * Math.cos(theta));
            const z = (radius * Math.sin(phi) * Math.sin(theta));
            const y = (radius * Math.cos(phi));

            return new THREE.Vector3(x, y, z);
        }

        // ================= 数据可视化：生成柱状图 =================
        const barsGroup = new THREE.Group();
        const barMeshes = []; // 存储所有柱体用于射线检测

        cityData.forEach(data => {
            // 1. 计算位置
            const pos = latLonToVector3(data.lat, data.lon, CONFIG.earthRadius);
            
            // 2. 计算高度 (基于人口)
            const height = Math.max(CONFIG.minBarHeight, data.population * CONFIG.barHeightScale);
            
            // 3. 确定颜色
            let colorHex;
            if (data.population < 2000) colorHex = CONFIG.colors.lowPop;
            else if (data.population < 3000) colorHex = CONFIG.colors.midPop;
            else colorHex = CONFIG.colors.highPop;

            // 4. 创建几何体 (圆柱)
            const geometry = new THREE.CylinderGeometry(0.8, 0.8, height, 16);
            // 调整几何体中心，使其底部贴合地球表面
            geometry.translate(0, height / 2, 0); 
            
            const material = new THREE.MeshPhongMaterial({ 
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: 0.4,
                shininess: 100
            });
            
            const bar = new THREE.Mesh(geometry, material);
            
            // 5. 定位与旋转
            bar.position.copy(pos);
            bar.lookAt(new THREE.Vector3(0, 0, 0)); // 指向地心
            bar.rotateX(Math.PI / 2); // 修正圆柱默认朝向
            
            // 存储自定义数据以便交互时读取
            bar.userData = { 
                isCity: true, 
                name: data.city, 
                country: data.country,
                isoCode: data.isoCode,
                lat: data.lat,
                lon: data.lon,
                population: data.population,
                originalColor: colorHex
            };

            barsGroup.add(bar);
            barMeshes.push(bar);
        });

        scene.add(barsGroup);

        // ================= 交互逻辑：Raycaster & Tooltip =================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        let hoveredObject = null;

        // ================= Tooltip 边界检测与位置计算 =================
        function calculateTooltipPosition(mouseX, mouseY) {
            const tooltipRect = tooltip.getBoundingClientRect();
            const margin = 15; // 与边缘的最小距离
            let left = mouseX;
            let top = mouseY - 10; // 向上偏移一点

            // 检测右边界
            if (left + tooltipRect.width / 2 > window.innerWidth - margin) {
                left = window.innerWidth - margin - tooltipRect.width / 2;
            }
            // 检测左边界
            if (left - tooltipRect.width / 2 < margin) {
                left = margin + tooltipRect.width / 2;
            }
            // 检测上边界（Tooltip 在鼠标上方显示）
            if (top - tooltipRect.height < margin) {
                top = mouseY + 30; // 改为在鼠标下方显示
            }
            // 检测下边界
            if (top > window.innerHeight - margin) {
                top = window.innerHeight - margin;
            }

            return { left, top };
        }

        // 鼠标移动事件
        window.addEventListener('mousemove', (event) => {
            // 归一化鼠标坐标
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            // 更新 Tooltip 位置（带边界检测）
            if (hoveredObject) {
                const pos = calculateTooltipPosition(event.clientX, event.clientY);
                tooltip.style.left = pos.left + 'px';
                tooltip.style.top = pos.top + 'px';
            }
        });

        // 点击事件 (相机聚焦)
        window.addEventListener('click', () => {
            if (hoveredObject) {
                controls.autoRotate = false; // 停止自动旋转
                
                // 计算目标位置：在城市上方一点
                const targetPos = hoveredObject.position.clone().normalize().multiplyScalar(CONFIG.earthRadius + 40);
                
                // 简单动画：线性插值移动相机 (实际项目可用 GSAP)
                const startPos = camera.position.clone();
                const startLookAt = controls.target.clone();
                const endLookAt = hoveredObject.position.clone();
                
                let progress = 0;
                const animateFocus = () => {
                    progress += 0.05;
                    if (progress >= 1) {
                        camera.position.copy(targetPos);
                        controls.target.copy(endLookAt);
                        controls.update();
                        return;
                    }
                    
                    camera.position.lerpVectors(startPos, targetPos, progress);
                    controls.target.lerpVectors(startLookAt, endLookAt, progress);
                    controls.update();
                    requestAnimationFrame(animateFocus);
                };
                animateFocus();
            }
        });

        // ================= 动画循环 =================
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // 射线检测
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(barMeshes);

            if (intersects.length > 0) {
                const object = intersects[0].object;
                
                if (hoveredObject !== object) {
                    // 恢复上一个悬停对象的颜色
                    if (hoveredObject) {
                        hoveredObject.material.emissiveIntensity = 0.4;
                        hoveredObject.scale.set(1, 1, 1);
                    }
                    
                    hoveredObject = object;
                    
                    // 高亮当前对象
                    hoveredObject.material.emissiveIntensity = 1.0;
                    hoveredObject.scale.set(1.2, 1.2, 1.2); // 稍微放大

                    // 显示 Tooltip（带国旗和完整信息）
                    const data = hoveredObject.userData;
                    const flagUrl = getFlagUrl(data.isoCode);
                    
                    // 构建国旗 HTML
                    let flagHtml = '';
                    if (flagUrl && data.isoCode) {
                        flagHtml = `<img src="${flagUrl}" alt="${data.country}国旗" 
                                    onerror="handleFlagError(this, '${data.isoCode}')">`;
                    } else {
                        flagHtml = `<div class="flag-placeholder">${data.isoCode || '?'}</div>`;
                    }

                    // 格式化经纬度显示
                    const formatLat = (lat) => {
                        const dir = lat >= 0 ? 'N' : 'S';
                        return `${Math.abs(lat).toFixed(2)}°${dir}`;
                    };
                    const formatLon = (lon) => {
                        const dir = lon >= 0 ? 'E' : 'W';
                        return `${Math.abs(lon).toFixed(2)}°${dir}`;
                    };

                    tooltip.innerHTML = `
                        <div class="tooltip-header">
                            <div class="flag-container">
                                ${flagHtml}
                            </div>
                            <div class="title-group">
                                <h3>${data.name}</h3>
                                <p class="country-name">${data.country}</p>
                            </div>
                        </div>
                        <div class="tooltip-content">
                            <div class="info-row">
                                <span class="info-label">经纬度</span>
                                <span class="info-value coord-value">${formatLat(data.lat)}, ${formatLon(data.lon)}</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">人口数量</span>
                                <span class="info-value">${data.population.toLocaleString()} 万</span>
                            </div>
                            <div class="info-row">
                                <span class="info-label">国家代码</span>
                                <span class="info-value">${data.isoCode || 'N/A'}</span>
                            </div>
                        </div>
                    `;
                    tooltip.style.display = 'block';
                    document.body.style.cursor = 'pointer';
                }
            } else {
                if (hoveredObject) {
                    // 恢复颜色
                    hoveredObject.material.emissiveIntensity = 0.4;
                    hoveredObject.scale.set(1, 1, 1);
                    hoveredObject = null;
                    
                    tooltip.style.display = 'none';
                    document.body.style.cursor = 'default';
                }
            }

            renderer.render(scene, camera);
        }

        // ================= 窗口自适应 =================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 移除加载提示
        document.getElementById('loading').style.opacity = 0;
        
        // 启动
        animate();

        console.log("3D 场景初始化完成。经纬度转换公式已应用：x = -R*sin(phi)*cos(theta), y = R*cos(phi), z = R*sin(phi)*sin(theta)");
    </script>
</body>
</html>
